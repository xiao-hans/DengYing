name: Gitee Upload Asset
description: 把单个 Release 附件同步到同名 Gitee Release，按「名字 + 字节数」去重。

# 【为什么不用单独一条同步工作流等产物】IPA 在 macOS runner 上要跑 30 分钟上下，
# 同步作业等满就退出，产物到了也没人传。改成谁构建谁上传：产物一落地就同步，
# 不存在等待窗口，也就没有「等不到就整单失败」。

inputs:
  tag:
    description: Release 标签，如 v1.4.1
    required: true
  file:
    description: 本地产物路径
    required: true
  token:
    description: Gitee access_token（由调用方传 secrets.GITEE_TOKEN）
    required: true

runs:
  using: composite
  steps:
    - name: Upload to Gitee release
      shell: bash
      env:
        GITEE_TOKEN: ${{ inputs.token }}
        GITEE_OWNER: han-xiaos-whisper
        GITEE_REPO: DengYing
        TAG: ${{ inputs.tag }}
        FILE: ${{ inputs.file }}
      run: |
        set -euo pipefail
        test -n "${GITEE_TOKEN:-}" || { echo "::error::缺少 Gitee token"; exit 1; }
        test -f "$FILE" || { echo "::error::产物不存在：$FILE"; exit 1; }

        NAME=$(basename "$FILE")
        SIZE=$(wc -c < "$FILE" | tr -d ' ')
        BASE="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
        TAG_ENC=$(printf '%s' "$TAG" | python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read().strip()))')

        echo "sync $NAME ($SIZE bytes) -> gitee $GITEE_REPO@$TAG"

        # 1. 找已有 Release；没有就建。Gitee 对未知 tag 返回 200 + null，按未创建处理。
        RELEASE_ID=""
        for attempt in 1 2 3; do
          CODE=$(curl -sS -o /tmp/gitee-release.json -w '%{http_code}' \
            "$BASE/releases/tags/$TAG_ENC?access_token=$GITEE_TOKEN" || echo 000)
          if [ "$CODE" = "200" ]; then
            RELEASE_ID=$(python3 -c 'import json;d=json.load(open("/tmp/gitee-release.json"));print(d.get("id","") if isinstance(d,dict) else "")' 2>/dev/null || true)
            [ -n "$RELEASE_ID" ] && break
            CODE=$(curl -sS -o /tmp/gitee-create.json -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json;charset=UTF-8' \
              "$BASE/releases?access_token=$GITEE_TOKEN" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"target_commitish\":\"$GITHUB_SHA\"}" || echo 000)
            RELEASE_ID=$(python3 -c 'import json;d=json.load(open("/tmp/gitee-create.json"));print(d.get("id","") if isinstance(d,dict) else "")' 2>/dev/null || true)
            [ -n "$RELEASE_ID" ] && break
          fi
          echo "release lookup/create status=$CODE (attempt $attempt/3)" >&2
          sleep $((attempt * 10))
        done
        test -n "$RELEASE_ID" || { echo "::error::无法解析或创建 Gitee Release $TAG"; exit 1; }
        echo "gitee release id=$RELEASE_ID"

        # 2. 列附件：同名字节数一致就跳过，同名不同大小先删再传。
        curl -sS "$BASE/releases/$RELEASE_ID/attach_files?access_token=$GITEE_TOKEN&per_page=100" -o /tmp/gitee-attach.json
        SAME=$(python3 - "$NAME" "$SIZE" <<'PY'
        import json,sys
        name,size=sys.argv[1],int(sys.argv[2])
        data=json.load(open("/tmp/gitee-attach.json"))
        for a in data if isinstance(data,list) else []:
            if a.get("name")==name and int(a.get("size") or 0)==size:
                print(a.get("id")); break
        PY
        ) || true
        if [ -n "$SAME" ]; then
          echo "Gitee 已有同名同大小附件（id=$SAME），跳过"
          exit 0
        fi
        STALE=$(python3 - "$NAME" <<'PY'
        import json,sys
        name=sys.argv[1]
        data=json.load(open("/tmp/gitee-attach.json"))
        for a in data if isinstance(data,list) else []:
            if a.get("name")==name:
                print(a.get("id")); break
        PY
        ) || true
        if [ -n "$STALE" ]; then
          echo "删除同名旧附件 id=$STALE"
          curl -sS -X DELETE "$BASE/releases/$RELEASE_ID/attach_files/$STALE?access_token=$GITEE_TOKEN" || true
        fi

        # 3. 上传。失败重试 3 次；Gitee 偶发 403 限流也在这一步兜。
        for attempt in 1 2 3; do
          CODE=$(curl -sS -o /tmp/gitee-upload.json -w '%{http_code}' \
            --connect-timeout 15 --max-time 900 \
            -X POST "$BASE/releases/$RELEASE_ID/attach_files?access_token=$GITEE_TOKEN" \
            -F "file=@$FILE" || echo 000)
          if [ "$CODE" = "201" ] || [ "$CODE" = "200" ]; then
            echo "已上传 $NAME -> $(python3 -c 'import json;print(json.load(open("/tmp/gitee-upload.json")).get("browser_download_url",""))' 2>/dev/null || true)"
            exit 0
          fi
          echo "上传失败 status=$CODE (attempt $attempt/3): $(head -c 200 /tmp/gitee-upload.json)" >&2
          sleep $((attempt * 15))
        done
        echo "::error::Gitee 上传失败：$NAME"
        exit 1
