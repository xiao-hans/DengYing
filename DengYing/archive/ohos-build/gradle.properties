# Compose(CMP 社区线) 链接期实测 OOM：默认 4G 堆在 linkDebugSharedOhosX64
# 阶段报 java.lang.OutOfMemoryError: Java heap space（2026-11-02）。
# :ohosUi 要吞 skiko + 全套 Compose klib，编译/链接的 IR 体量远超 :ohosShared，
# 故本独立构建单独调高；主构建（仓根 gradle.properties）不受影响。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx3072m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1

# === 渲染后端（1.9.2-1.1.0 线）===
# compose-gradle-plugin 1.9.2-1.1.0 读 rendererBackend（resolveOhosBackendConfig），
# 支持值：skia / fusion-renderer。
# 2026-11-04 终局决策：**fusion-renderer + 自写 6 个旧名 @CName shim**。
#   - skia 后端实测 11-03 起白屏（swapBuffers error 1 / RS waitfence timeout）；
#   - fusion 后端的 6 个旧 @CName（createRootRenderNode/renderNodeDraw/
#     renderNodeNotifyRedraw/setNodeConstructor/buildInstance/setPixelRatio）
#     在 export 1.9.2-1.1.0 已被删除（klib dump 实证），但 compose.har 的
#     modules.abc 硬编码旧名 -> 必须由我们的代码补这 6 个 @CName，
#     内部委托 export 1.9.2-1.1.0 的新 fusion API（initFusionRendererNode 等）。
#   - OH.0.1.2-24 线（platform.ohos 命名空间 + 旧 6 入口原生自带）需要
#     KGP 2.2.21-OH.0.1.0-04，其 Windows 编译器在 Nexus 不存在（260 个
#     tar.gz 全查，windows=NONE）-> Windows 构建不了，弃。
rendererBackend=fusion-renderer
