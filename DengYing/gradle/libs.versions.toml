# 版本目录 —— 依赖版本的单一来源
#
# 【为什么每个版本都是这个值】取值不是"最新"，而是「在 compileSdk 36 上可解析」的交集。
# AndroidX 自 2025 起在 AAR 里带 `minCompileSdk` 元数据，低于它的 compileSdk 会直接构建失败。
# 实测（2026-10-17，读各 AAR 的 META-INF/com/android/build/gradle/aar-metadata.properties）：
#
#   core-ktx 1.17.0            -> minCompileSdk=36   ← 决定了 compileSdk 下限
#   core-ktx 1.19.1            -> minCompileSdk=37   ← 不可用（需 Android 17 预览）
#   activity-compose 1.13.0    -> minCompileSdk=36
#   media3 1.10.1              -> minCompileSdk=36
#   compose ui 1.11.4          -> minCompileSdk=35
#   compose material3 1.4.0    -> minCompileSdk=35
#   navigation-compose 2.9.8   -> minCompileSdk=35   （2.10.2 是 37，不可用）
#   lifecycle 2.9.4            -> minCompileSdk=35   （2.11.0 是 37，不可用）
#
# 故 compileSdk 必须取 36（= 需求「兼容 sdk 安卓16」），其余依赖取「要求 ≤36 的最新稳定版」。
# 升级任一依赖前先核该 AAR 的 minCompileSdk，否则会把 compileSdk 一起顶到 37。

[versions]
# 构建工具链
agp = "8.13.2"                 # 支持 Gradle 8.13+；JDK 17+ 即可（本机 JDK 18 已实测）
kotlin = "2.4.21"              # KMP 迁移 P0（docs/09）。官方兼容区间 AGP 8.5.2–9.3.1 /
                               # Gradle 7.6.3–9.7.0，覆盖现有 agp/gradleWrapper，无需同升。
                               # 附注：2.2.20 官方只支持 AGP ≤8.11.1，配 8.13.2 实为超范围
                               # （能构建但无保证）；2.4.21 把 AGP 8.13 纳回支持区间。
gradleWrapper = "8.14.3"

# SDK 级别（需求：兼容 16 / 最小 12）
compileSdk = "36"              # Android 16
minSdk = "31"                  # Android 12
targetSdk = "36"

# AndroidX（全部经实测 minCompileSdk 校验，见文件头）
coreKtx = "1.17.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"      # -> compose ui 1.11.4 / material3 1.4.0
# KMP P4-3：Compose Multiplatform（:ui 模块）。守 docs/09 §5 P0 的「1.10.x」口径，
# 取 1.10 线最新补丁版。插件版本与 Kotlin 编译器解耦（Compose 编译器插件自 Kotlin 2.0
# 起随 Kotlin 发布，即上面 kotlin = 2.4.21 那条），故只需核对插件与 AGP/Gradle 的兼容性。
# 1.10.x 线在 Maven 上已不可得（最早可用 1.11.0），且 1.10.3 插件已把 `compose.*`
# 访问器标为 Deprecated(ERROR)，故按 docs/04 §14.0.6 预案升到 1.12.2。
composeMultiplatform = "1.11.1"
# material3 自 CMP 1.9 起独立版本线，最新稳定是 1.9.0（1.10~1.12 只有 alpha）。
composeMaterial3 = "1.9.0"
# JB 的 KMP lifecycle 构件。包名与 AndroidX 相同（androidx.lifecycle.*），
# 故 :ui/commonMain 的纯净扫描对 androidx.lifecycle.* 例外放行（见 docs/04 §14.0.4）。
# 取 2.9.4 与 :app 现用的 androidx lifecycle 对齐，避免同一进程里两套 ViewModel 语义。
lifecycleKmp = "2.9.4"
# JB 的 KMP navigation 构件（同样沿用 androidx.navigation 包名）。
navigationKmp = "2.9.2"
navigationCompose = "2.9.8"
lifecycle = "2.9.4"

# 播放与投屏
media3 = "1.10.1"
mediarouter = "1.8.1"
# GMS Cast 框架（FR-418..423）。23.0.0 的 cast-framework POM 传递依赖
# androidx.mediarouter:1.9.0-beta01，故 app 侧用 resolutionStrategy 锁回 1.8.1，
# 不把 mediarouter 升到 beta。AAR 的 minCompileSdk=1，不会顶高 compileSdk 36。
# 依赖 com.google.android.gms:play-services-cast-framework（含 play-services-cast / basement），
# 是接入 OPTIONS_PROVIDER_CLASS_NAME 的前提；口径变化见 docs/01 §1。
playServicesCastFramework = "23.0.0"

# 协程
coroutines = "1.11.0"

# JSON（KMP 迁移 P3，docs/09 §5.1）
# 只引运行时库，不引 `kotlinx-serialization` 编译插件：迁移走 `JsonElement` 遍历式，
# 不用 `@Serializable`。1.12.0 是 2026 年最新稳定版，与 Kotlin 2.4 兼容。
serialization = "1.12.0"

# 测试（仅 JVM 单测，不进 APK）
junit = "4.13.2"
jsonStub = "20250107"          # org.json 的真实现，供 JVM 单测使用（Android 上是系统内置）

# 真机测试（androidTest）。取值原则同上：只求「在 compileSdk 36 上可解析」的稳定版。
# 1.7.0 是 2025 年起的稳定线，minCompileSdk 要求 34，低于本项目 36，不会顶高。
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"

[libraries]
# ---- AndroidX 基础 ----
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# ---- Compose（版本由 BOM 统一，此处不写版本号）----
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# ---- 导航与生命周期 ----
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# ---- Media3（播放引擎；替代鸿蒙的 media.AVPlayer）----
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }

# ---- 投屏（替代鸿蒙的 AVSessionKit 投播）----
androidx-mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "mediarouter" }
# GMS Cast 框架：提供 CastContext / SessionManager / RemoteMediaClient / OptionsProvider。
# 只在 :app 使用，:ui/commonMain 不认识 GMS 类型。
play-services-cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "playServicesCastFramework" }

# ---- 协程 ----
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# commonMain 用：-android 是 -core 的 Android 附加件（主线程调度器），跨平台逻辑只该依赖 -core
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# ---- JSON ----
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# ---- 测试 ----
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "jsonStub" }
# kotlin.test 在 KMP 里按 target 自动选变体（jvm 侧落到 kotlin-test-junit），故无需写变体后缀
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# ---- 真机测试（androidTest，仅测试期，不进 release APK）----
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

# ---- Compose Multiplatform（KMP P4-3，:ui 模块）----
# CMP 的构件由 `compose.*` 访问器提供（插件自带），这里只声明需要显式版本的两条：
# 版本目录里写出来是为了让「哪些是 JB 的 KMP 构件」一目了然，而不是散落在 build 脚本里。
compose-multiplatform-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleKmp" }
compose-multiplatform-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleKmp" }
compose-multiplatform-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationKmp" }

# CMP 构件显式坐标：1.10.3 起 `compose.runtime` 等访问器被弃用（Deprecated ERROR 级别，
# Kotlin DSL 里直接编译失败），必须写明 module。版本随 composeMultiplatform。
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# CMP 插件：提供 `compose.*` 依赖访问器（runtime/foundation/material3/ui）。
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
